name: offershield

# Only Caddy publishes a port (127.0.0.1:80). Two networks: "edge" (Caddy, app, frontend) and
# "internal" (app, MySQL, Kafka; no outbound internet). Caddy cannot reach MySQL or Kafka.
services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    ports:
      - "127.0.0.1:80:80"
    environment:
      SITE_ADDRESS: ${APP_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: 
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Angular app served by unprivileged nginx on :8080 (M-05); reached only through Caddy.
  # Read-only root: nginx-unprivileged writes only its pid and temp files, all under /tmp
  # (logs are symlinks to stdout/stderr). It needs no capabilities (uid 101, port 8080).
  frontend:
    build:
      context: ./frontend
    image: offershield-frontend:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./backend
    image: offershield-app:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - internal
    environment:
      DB_URL: jdbc:mysql://mysql:3306/offershield_db
      DB_USERNAME: offershield_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      TEXT_AES_KEY_BASE64: ${TEXT_AES_KEY_BASE64:?TEXT_AES_KEY_BASE64 is not set in .env}
      INDICATOR_HMAC_PEPPER: ${INDICATOR_HMAC_PEPPER:?INDICATOR_HMAC_PEPPER is not set in .env}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      # D-11: blank = AI off (reports say "AI unavailable"); AI_CHAIN blank = the default Groq chain.
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      AI_CHAIN: ${AI_CHAIN:-}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set in .env}
      MYSQL_ROOT_HOST: localhost
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  kafka-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  internal:
    internal: true
