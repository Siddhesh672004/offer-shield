spring:
  application:
    name: offershield
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/offershield_db}
    username: ${DB_USERNAME:offershield_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

offershield:
  admin:
    emails: ${ADMIN_EMAILS:}
