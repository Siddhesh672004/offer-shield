# Static Angular app behind Caddy. Security headers (CSP etc.) are added by Caddy (D-10).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # Never serve dotfiles (.git, .env, .htaccess …) if one ever lands in the image.
    # Listed first so it wins over the regex locations below.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bundles with a content hash in the name (main-AB12CD34.js, chunk-…, styles-…) never change.
    # A missing bundle is a real 404, never index.html (that would be served as the wrong type).
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and every app route that falls back to it) is revalidated, so a release shows up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
